[workspace]
members = ["crates/smsl_core", "crates/smsl_cli", "crates/smsl_ffi"]
resolver = "3"

[workspace.package]
version = "0.2.0-hello-world"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/state-language/smsl"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smsl-core = { version = "=0.2.0-hello-world", path = "crates/smsl_core" }

[profile.release]
panic = "abort"
lto = "thin"
